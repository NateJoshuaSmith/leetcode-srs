[project]
name = "nctrack"
version = "0.1.0"
description = "Command-line NeetCode progress tracker with spaced repetition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
nctrack = "nctrack.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nctrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
